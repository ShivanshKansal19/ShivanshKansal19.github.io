<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shiva's terminal portfolio." />
    <title>shiva@portfolio:~</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="terminal" aria-label="Shiva's interactive portfolio terminal">
      <section id="output" class="output" aria-live="polite">
        <pre class="logo" aria-label="Shiva">
   _____ __  __ ____ _    __ ___
  / ___// / / //  _/| |  / //   |
  \__ \/ /_/ / / /  | | / // /| |
 ___/ / /‾/ / / /   | |/ // ___ |
/____/_/ /_//___/   |___//_/  |_|</pre
        >
        <p><span class="green">Welcome to my interactive portfolio.</span></p>
        <p>Type <code>help</code> to see available commands.</p>
      </section>
      <form id="terminal-form" class="prompt-line">
        <label for="command"
          ><span class="green">shiva@portfolio</span>:<span class="blue">~</span
          >$</label
        >
        <div class="input-container">
          <input
            id="command"
            autocomplete="off"
            spellcheck="false"
            autofocus
            aria-label="Enter a terminal command"
          />
          <span id="ghost-hint" class="ghost-hint" aria-hidden="true"></span>
        </div>
      </form>
    </main>
    <script src="script.js"></script>
  </body>
</html>
